<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Palacio del Tiempo</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=MedievalSharp&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="frame">
      <h1 class="title">El Palacio del Tiempo</h1>
      <div class="stage">
        <canvas id="game" width="960" height="470" tabindex="0"></canvas>
        <div id="touch">
          <div class="pad left">
            <button data-act="left" aria-label="Izquierda">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button data-act="right" aria-label="Derecha">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <div class="pad right">
            <button data-act="down" aria-label="Agacharse">
              <i class="fa-solid fa-angles-down"></i>
            </button>
            <button data-act="up" aria-label="Saltar">
              <i class="fa-solid fa-angles-up"></i>
            </button>
            <button data-act="attack" class="attack" aria-label="Atacar">
              <i class="fa-solid fa-khanda"></i>
            </button>
          </div>
        </div>
      </div>
      <p class="hint">
        <span class="key">A</span><span class="key">D</span> Moverse
        &nbsp;·&nbsp; <span class="key">W</span> Saltar &nbsp;·&nbsp;
        <span class="key">S</span> Agacharse &nbsp;·&nbsp;
        <span class="key">Shift</span> Golpear
        <i class="fa-solid fa-khanda" style="color: #d8af46"></i> &nbsp;·&nbsp;
        en celular usa los <b>botones en pantalla</b>
      </p>
    </div>

    <script src="juego.js"></script>
  </body>
</html>
